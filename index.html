
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website đầu tiên của tôi</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f7f4;
      color: #243b32;
      text-align: center;
    }

    header {
      background: #176b50;
      color: white;
      padding: 45px 20px;
    }

    h1 {
      font-size: 32px;
    }

    main {
      padding: 35px 20px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 15px #00000012;
    }

    button {
      background: #176b50;
      color: white;
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    footer {
      padding: 20px;
      color: #52675d;
    }
  </style>
</head>

<body>
  <header>
    <h1>Xin chào! 👋</h1>
    <p>Chào mừng đến website đầu tiên của tôi.</p>
  </header>

  <main>
    <div class="card">
      <h2>Tôi đang học HTML</h2>
      <p>Tôi vừa tạo trang web đầu tiên bằng GitHub.</p>
      <button onclick="alert('Bạn đã tạo website thành công!')">
        Bấm thử nhé
      </button>
    </div>
  </main>

  <footer>
    Website được xây dựng bằng HTML và CSS.
  </footer>
</body>
</html>
